name: Run pytest tests tests on macos

on:
  workflow_call:
    inputs:
      python-versions:
        description: 'Supported python versions'
        default: '["3.13", "3.14"]'
        required: false
        type: string
    secrets:
      codecov_token:
        description: 'Codecov token'
        required: false

jobs:
  mysql:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    env:
      OS: macos-latest
      PYTHON: ${{ matrix.python-version }}
    steps:
    - uses: actions/checkout@v6
    - uses: ankane/setup-mysql@v1
      with:
        mysql-version: 8.4
    - name: Check MySQL Version
      run: mysqld --version
    - name: Set up uv with python ${{ matrix.python-version }}
      uses: fizyk/actions-reuse/.github/actions/uv-setup@7eefbd6ffc6c6787ad3be6ce93dcf475e3ae99b5 # v5.6.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Check MySQL Version
      run: mysqld --version
    - name: Run test
      uses: fizyk/actions-reuse/.github/actions/uv-pytest-coverage@7eefbd6ffc6c6787ad3be6ce93dcf475e3ae99b5 # v5.6.0
      with:
        pytest-opts: -p no:xdist -k "not mysqlnoproc" --mysql-user=root --basetemp=/tmp/pytest_mysql
        data-file: .coverage.serial
        output-file: coverage-serial.xml
    - name: Upload coverage to Codecov
      if: ${{ always() }}
      uses: codecov/codecov-action@v6.0.0
      with:
        files: coverage-serial.xml
        flags: macos,mysql
        env_vars: OS,PYTHON
        fail_ci_if_error: false
        token: ${{ secrets.codecov_token }}

  mariadb:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    env:
      OS: macos-latest
      PYTHON: ${{ matrix.python-version }}
    steps:
    - uses: actions/checkout@v6
    - uses: ankane/setup-mariadb@v1
      with:
        mariadb-version: "11.4"
    - name: Check MySQL Version
      run: mysqld --version
    - name: Set up uv with python ${{ matrix.python-version }}
      uses: fizyk/actions-reuse/.github/actions/uv-setup@7eefbd6ffc6c6787ad3be6ce93dcf475e3ae99b5 # v5.6.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Run test
      uses: fizyk/actions-reuse/.github/actions/uv-pytest-coverage@7eefbd6ffc6c6787ad3be6ce93dcf475e3ae99b5 # v5.6.0
      with:
        pytest-opts: --mysql-user=$USER -p no:xdist -k "not mysqlnoproc" --basetemp=/tmp/pytest_mysql
        data-file: .coverage.serial
        output-file: coverage-serial.xml
    - name: Upload coverage to Codecov
      if: ${{ always() }}
      uses: codecov/codecov-action@v6.0.0
      with:
        files: coverage-serial.xml
        flags: macos,mariadb
        env_vars: OS,PYTHON
        fail_ci_if_error: false
        token: ${{ secrets.codecov_token }}

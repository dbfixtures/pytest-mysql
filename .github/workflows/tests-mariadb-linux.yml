name: Run pytest tests

on:
  workflow_call:
    inputs:
      python-versions:
        description: 'Supported python versions'
        default: '["3.10", "3.11", "3.12", "3.13", "3.14", "pypy-3.11"]'
        required: false
        type: string
      mariadb:
        description: 'MariaDB version'
        required: true
        type: string
    secrets:
      codecov_token:
        description: 'Codecov token'
        required: false

jobs:
  mariadb:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    env:
      OS: ubuntu-latest
      PYTHON: ${{ matrix.python-version }}
    services:
      mysql:
        image: mariadb:${{ inputs.mariadb }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: yes
          MARIADB_DATABASE: tests
        ports:
          - 3333:3306
        options: --health-cmd="healthcheck.sh --su-mysql --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ankane/setup-mariadb@v1 # zizmor: ignore[unpinned-uses]
        with:
          mariadb-version: ${{ inputs.mariadb }}
      - name: Check MariaDB Version
        run: mysqld --version
      - name: Set up uv with python ${{ matrix.python-version }}
        uses: fizyk/actions-reuse/.github/actions/uv-setup@7eefbd6ffc6c6787ad3be6ce93dcf475e3ae99b5 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run test
        uses: fizyk/actions-reuse/.github/actions/uv-pytest-coverage@7eefbd6ffc6c6787ad3be6ce93dcf475e3ae99b5 # v5.6.0
        with:
          pytest-opts: -p no:xdist --mysql-user=$USER -k "not mysqlnoproc"
          data-file: .coverage.serial
          output-file: coverage-serial.xml
      - name: Run xdist test
        uses: fizyk/actions-reuse/.github/actions/uv-pytest-coverage@7eefbd6ffc6c6787ad3be6ce93dcf475e3ae99b5 # v5.6.0
        with:
          pytest-opts: --max-worker-restart=0 -n auto --mysql-user=$USER -k "not mysqlnoproc"
          coverage-config: .coveragerc
          data-file: .coverage.xdist
          output-file: coverage-xdist.xml
      - name: Run noproc test
        uses: fizyk/actions-reuse/.github/actions/uv-pytest-coverage@7eefbd6ffc6c6787ad3be6ce93dcf475e3ae99b5 # v5.6.0
        with:
          pytest-opts: -p no:xdist -k mysqlnoproc --mysql-host="127.0.0.1" --mysql-port=3333
          coverage-config: .coveragerc
          data-file: .coverage.noproc
          output-file: coverage-noproc.xml
      - name: Upload coverage to Codecov
        if: ${{ always() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.0
        with:
          files: coverage-serial.xml,coverage-xdist.xml,coverage-noproc.xml
          flags: linux,mariadb
          env_vars: OS,PYTHON
          fail_ci_if_error: false
          token: ${{ secrets.codecov_token }}

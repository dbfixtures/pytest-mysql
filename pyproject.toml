[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=61.0.0" ]

[project]
name = "pytest-mysql"
version = "4.0.0"
description = "MySQL process and client fixtures for pytest"
readme = "README.rst"
keywords = [ "fixture", "mysql", "pytest", "tests" ]
license = { file = "COPYING.lesser" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
]
dependencies = [ "mirakuru>=2.6.0", "packaging>=23", "port-for>=0.7.3", "pymysql>=1.1.1", "pytest>=8.4" ]

[[project.authors]]
name = "Grzegorz Śliwiński"
email = "fizyk+pypi@fizyk.dev"

[project.urls]
Source = "https://github.com/dbfixtures/pytest-mysql"
"Bug Tracker" = "https://github.com/dbfixtures/pytest-mysql/issues"
Changelog = "https://github.com/dbfixtures/pytest-mysql/blob/v4.0.0/CHANGES.rst"

[project.entry-points.pytest11]
pytest_mysql = "pytest_mysql.plugin"

[tool.setuptools]
zip-safe = true

[tool.setuptools.packages.find]
include = [ "pytest_mysql*" ]
exclude = [ "tests*" ]
namespaces = false

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "S602"
]

[tool.pyproject-fmt]
column_width = 120
indent = 4
keep_full_version = true
generate_python_version_classifiers = false
table_format = "long"
sub_table_spacing = "\n"

[tool.pytest]
addopts = [ "--showlocals", "--verbose" ]
mysql_dbname = "pytestmysql"
testpaths = [ "tests" ]
xfail_strict = true

[[tool.tbump.before_commit]]
name = "Build changelog"
cmd = "pipenv run towncrier build --version {new_version} --yes"

[[tool.tbump.field]]
name = "extra"
default = ""

[[tool.tbump.file]]
src = "pytest_mysql/__init__.py"

[[tool.tbump.file]]
src = "pyproject.toml"
search = 'version = "{current_version}"'

[[tool.tbump.file]]
src = "pyproject.toml"
search = 'Changelog = "https://github.com/dbfixtures/pytest-mysql/blob/v{current_version}/CHANGES.rst"'

[tool.tbump.git]
message_template = "Release {new_version}"
tag_template = "v{new_version}"

[tool.tbump.version]
current = "4.0.0"
regex = '''
  (?P<major>\d+)
  \.
  (?P<minor>\d+)
  \.
  (?P<patch>\d+)
  (\-
    (?P<extra>.+)
  )?
  '''

[tool.towncrier]
directory = "newsfragments"
filename = "CHANGES.rst"
issue_format = "`#{issue} <https://github.com/dbfixtures/pytest-mysql/issues/{issue}>`_"
single_file = true

[[tool.towncrier.type]]
directory = "break"
name = "Breaking changes"
showcontent = true

[[tool.towncrier.type]]
directory = "depr"
name = "Deprecations"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "Features"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bugfixes"
showcontent = true

[[tool.towncrier.type]]
directory = "docs"
name = "Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Miscellaneous"
showcontent = true
